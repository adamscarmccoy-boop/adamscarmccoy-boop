name: LM Studio Task

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt to send to LM Studio
        required: true
        type: string
      model:
        description: LM Studio model identifier to use
        required: false
        default: local-model
        type: string

jobs:
  run-lm-studio-task:
    name: Run task with LM Studio
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      LM_STUDIO_BASE_URL: ${{ vars.LM_STUDIO_BASE_URL || 'http://127.0.0.1:1234/v1' }}
      LM_STUDIO_API_KEY: ${{ secrets.LM_STUDIO_API_KEY || 'lm-studio' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Send prompt to LM Studio
        env:
          LM_STUDIO_MODEL: ${{ inputs.model }}
          LM_STUDIO_PROMPT: ${{ inputs.prompt }}
        run: |
          python scripts/lm_studio_task.py \
            --base-url "$LM_STUDIO_BASE_URL" \
            --api-key "$LM_STUDIO_API_KEY" \
            --model "$LM_STUDIO_MODEL" \
            --prompt "$LM_STUDIO_PROMPT"
